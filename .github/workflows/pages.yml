name: Deploy to GitHub Pages

# Deploys only after CI has gone green on main, so a commit that fails lint or
# tests cannot reach the published page.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancelling an in-flight deployment can leave it stuck; let it finish.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only what the page needs. Uploading the repository root would
      # put the test suite, the lockfile and a 35KB licence on the live site.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
