name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Not `npm run coverage`: the layout search is CPU-bound, and v8
      # instrumentation makes this suite roughly ten times slower for a metric
      # that says little here -- the tests bound the engine's work explicitly.
      - run: npm run test
